name = "aifaculty-signup"
main = "index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Same-origin signup endpoint once aifaculty.org is live. landing/app.js posts
# to /signup when the host matches *.aifaculty.org, and cross-origin to the
# workers.dev URL everywhere else (e.g. the *.pages.dev preview).
routes = [
  { pattern = "aifaculty.org/signup", zone_name = "aifaculty.org" }
]

[[kv_namespaces]]
binding = "SIGNUPS"
id = "1764d7ac08d14438aa1179e4a748cbce"

[vars]
RESEND_FROM = "AI Faculty <earlyaccess@aifaculty.org>"
# Leave empty to disable Resend notification
RESEND_API_KEY = ""

# Optional: harden against a single IP hammering the form
[vars.rate_limit]
window_seconds = 3600
max_per_ip = 5
