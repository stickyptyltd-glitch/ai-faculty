name = "aifaculty-api"
main = "index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Same-origin API for the app once aifaculty.org is live. main.js's AUTH client posts to
# /api/... when the host matches *.aifaculty.org, and to the workers.dev URL otherwise
# (previews, local testing) — same split as landing/app.js uses for /signup.
routes = [
  { pattern = "aifaculty.org/api/*", zone_name = "aifaculty.org" }
]

[[d1_databases]]
binding = "DB"
database_name = "aifaculty"
database_id = "3e1266d0-4cf9-4d99-a3fd-fc8bd328cfa7"

# Reused from the signup Worker for auth-request rate limiting (prefix "authrl:" keeps keys
# from colliding with signup's "rl:"/"email:" keys in the same namespace).
[[kv_namespaces]]
binding = "SIGNUPS"
id = "1764d7ac08d14438aa1179e4a748cbce"

[vars]
APP_ORIGIN = "https://aifaculty.org"
RESEND_FROM = "AI Faculty <accounts@aifaculty.org>"
# Dev mode requires BOTH of these: RESEND_API_KEY empty AND DEV_LINKS "true" — deliberately two
# switches, not one, so setting the Resend key alone can't be the only thing standing between
# this endpoint and "hand out a session for any email typed in". Before real users touch
# accounts: set RESEND_API_KEY to a real key (real email takes over automatically) AND flip
# DEV_LINKS to "false" (or delete it). With neither set, sign-in returns 503 rather than a link.
RESEND_API_KEY = ""
DEV_LINKS = "true"

[vars.rate_limit]
window_seconds = 3600
max_per_ip = 8
