name = "aifaculty-api"
main = "index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Same-origin API for the app once aifaculty.org is live. main.js's AUTH client posts to
# /api/... when the host matches *.aifaculty.org, and to the workers.dev URL otherwise
# (previews, local testing) — same split as landing/app.js uses for /signup.
routes = [
  { pattern = "aifaculty.org/api/*", zone_name = "aifaculty.org" }
]

[[d1_databases]]
binding = "DB"
database_name = "aifaculty"
database_id = "3e1266d0-4cf9-4d99-a3fd-fc8bd328cfa7"

# Reused from the signup Worker for auth-request rate limiting (prefix "authrl:" keeps keys
# from colliding with signup's "rl:"/"email:" keys in the same namespace).
[[kv_namespaces]]
binding = "SIGNUPS"
id = "1764d7ac08d14438aa1179e4a748cbce"

[vars]
APP_ORIGIN = "https://aifaculty.org"
RESEND_FROM = "AI Faculty <accounts@aifaculty.org>"
# Real sign-in by email uses Cloudflare Email Service (founder chose it over Resend). The binding
# below is the whole remaining step, but it REQUIRES Workers Paid — deploying with it on the Free
# plan fails. To switch it on:
#   1. Upgrade the Cloudflare account to Workers Paid ($5/mo) in the dashboard.
#   2. Onboard aifaculty.org to Email Service (dashboard > Email > Email Sending > Add domain).
#   3. Uncomment the send_email block at the bottom of this file.
#   4. ./build.sh && npx wrangler deploy --config workers/api/wrangler.toml
# The worker already prefers this binding over Resend, so nothing else changes and dev links go
# quiet automatically — once a real sender exists, no link is ever returned in a response body.
#
# Resend is kept as a zero-cost fallback: set RESEND_API_KEY and it takes over if EMAIL is absent.
RESEND_API_KEY = ""
MAIL_FROM = "accounts@aifaculty.org"

# With no sender bound, sign-in by link is dev-only and gated three ways: no RESEND key AND
# DEV_LINKS "true" AND the caller already holding a founder session. The third condition is the one
# that matters — the first two were public config switches, but a session is a credential, so dev
# links can no longer be minted for an address you don't already control. That closed a full
# takeover of the /api/admin/* surface via the founder's own email address.
DEV_LINKS = "true"

# Monetization (docs/11-monetization.md). Payments stay OFF until the Stripe secrets are set:
#   npx wrangler secret put STRIPE_SECRET_KEY      --name aifaculty-api
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET  --name aifaculty-api
# then fill the price IDs below (created in the Stripe dashboard). Until then every
# /api/payments/* endpoint returns 501 payments_not_configured and the UI shows a waitlist CTA.
STRIPE_PRICE_PRO_MONTHLY = ""
STRIPE_PRICE_PRO_ANNUAL = ""
STRIPE_PRICE_FOUNDING = ""

# Founder password sign-in work factor. The Workers Free plan caps CPU at 10ms per request,
# and PBKDF2-SHA256 at the OWASP-recommended 600k iterations blows straight through it (the
# Worker throws, so every password call 500s). 10k is what fits the free-tier budget with
# headroom. Raise this to "600000" once the account is on Workers Paid — credentials upgrade
# themselves on the next successful sign-in, because the iteration count is stored per row and
# a login re-hashes at the current setting when it differs. No migration, no reset.
PASSWORD_ITERATIONS = "10000"

# Phase 3 — Institutional AI Control Plane (docs/01-architecture.md §3). Assessments run on the
# deterministic "dry-run" adapter until a model is configured; the same /api/faculty/assess endpoint
# then uses the model and every call is audited to faculty_calls. To turn the model on:
#   npx wrangler secret put FACULTY_MODEL_KEY --name aifaculty-api
# then set FACULTY_ADAPTER="openai-compatible" and the base URL + model name below. The secret is
# set this way (never in this file) and kept out of the repo.
FACULTY_ADAPTER = "dry-run"
FACULTY_MODEL_BASE_URL = ""
FACULTY_MODEL_NAME = ""

[vars.rate_limit]
window_seconds = 3600
max_per_ip = 8

# Cloudflare Email Service. UNCOMMENT ONLY after the account is on Workers Paid and aifaculty.org
# is onboarded to Email Sending — deploying this on the Free plan fails outright, which is why it
# ships commented out rather than being left in and failing the next unrelated deploy.
# The worker checks for env.EMAIL first, so enabling this is all it takes to go live.
#
# [[send_email]]
# name = "EMAIL"
# remote = true
